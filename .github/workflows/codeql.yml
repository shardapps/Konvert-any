name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    name: C# security analysis
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b # v3
        with:
          languages: csharp
          build-mode: manual
      - run: dotnet build Konvert.sln -c Release
      - uses: github/codeql-action/analyze@5c8ea125689a2c5ae2672d1d914ac4bcd95d1b4b
