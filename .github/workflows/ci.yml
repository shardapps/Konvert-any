name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build, test and format
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Konvert.sln
      - run: dotnet build Konvert.sln -c Release --no-restore
      - run: dotnet format Konvert.sln --verify-no-changes --no-restore
      - name: Compile and test Windows helpers
        shell: pwsh
        run: |
          ./scripts/Build-NativeHost.ps1 -Architecture x64
          $test = Start-Process artifacts/native-x64/KonvertHost.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($test.ExitCode) { throw 'Native listener tests failed.' }
          Copy-Item artifacts/native-x64/KonvertPdf.exe tests/Konvert.Tests/bin/Release/net10.0-windows/
      - run: dotnet run --project tests/Konvert.Tests -c Release --no-build -- --require-pdf-renderer
      - name: Dependency audit
        shell: pwsh
        run: |
          $report = dotnet list Konvert.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Dependency audit failed.' }
          if ($report.projects.frameworks.topLevelPackages.vulnerabilities -or $report.projects.frameworks.transitivePackages.vulnerabilities) { throw 'Vulnerable dependencies detected.' }
  engines:
    name: Optional engine integration
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Install test engines
        run: choco install ffmpeg libreoffice-fresh --yes --no-progress --limit-output
      - name: Test actual engine exports and decoding
        shell: pwsh
        run: |
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH','Machine') + ';' + $env:PATH
          dotnet run --project tests/Konvert.Tests -c Release -- --require-ffmpeg --require-office
          if ($LASTEXITCODE) { throw 'Engine integration failed.' }
  package:
    name: Package (${{ matrix.arch }})
    needs: [verify, engines]
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Publish verified desktop payload
        run: ./scripts/Build.ps1 -Runtime win-${{ matrix.arch }} -SkipVerification
      - name: Install packaging compiler
        run: choco install innosetup --yes --no-progress --limit-output
      - run: ./scripts/Build-Installer.ps1 -Architecture ${{ matrix.arch }} -PayloadDirectory artifacts/win-${{ matrix.arch }}-compact
      - name: Check out the standalone alpha for migration testing
        if: matrix.arch == 'x64'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cd062b3efe69569d0af529f50cb4d93e03239e9c
          path: artifacts/legacy-0.2
          persist-credentials: false
      - name: Build the legacy fixture
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./artifacts/legacy-0.2/scripts/Build-Installer.ps1 -Architecture x64
      - name: Verify clean install, legacy upgrade and removal
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          ./scripts/Test-Installer.ps1 -Installer "artifacts/installers/Konvert-Setup-$version-x64.exe" `
            -LegacyInstaller artifacts/legacy-0.2/artifacts/installers/Konvert-Setup-0.2.0-alpha.1-x64.exe `
            -LegacyArchive artifacts/legacy-0.2/artifacts/win-x64-standalone.zip
      - name: Retain installer diagnostics on failure
        if: failure() && matrix.arch == 'x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Konvert-x64-installer-diagnostics
          path: artifacts/installer-test/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - run: ./scripts/Build-Msix.ps1 -Architecture ${{ matrix.arch }} -IdentityName Shardapps.Konvert.Development -Publisher CN=Shardapps.Development
      - name: Upload compact setup
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Konvert-setup-${{ matrix.arch }}
          path: artifacts/installers/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Konvert-${{ matrix.arch }}-preview
          path: |
            artifacts/*.zip
            artifacts/*.msix
          if-no-files-found: error
          retention-days: 14
